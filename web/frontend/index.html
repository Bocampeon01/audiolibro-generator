<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Audiolibro Generator</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%236C5CE7'/><path d='M9 20v-4a7 7 0 0 1 14 0v4' fill='none' stroke='white' stroke-width='2.5'/><rect x='7' y='19' width='5' height='7' rx='2' fill='white'/><rect x='20' y='19' width='5' height='7' rx='2' fill='white'/></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header>
    <h1>Audiolibro Generator</h1>
    <p class="subtitle">PDF, DOCX o TXT &rarr; audiolibro M4B con capitulos. Voz local, sin nube.</p>
    <p class="phone-url hidden" id="phone-url">En la app del celular (mismo WiFi), usa: <code id="phone-url-value"></code></p>
  </header>

  <section class="card">
    <form id="upload-form">
      <label class="dropzone" id="dropzone">
        <input type="file" id="file-input" accept=".pdf,.docx,.txt" hidden>
        <span id="dropzone-text">Arrastra un archivo aca o hace click para elegirlo</span>
        <span id="dropzone-filename" class="filename"></span>
      </label>

      <div class="row">
        <label for="lang-select">Idioma</label>
        <select id="lang-select">
          <option value="auto" selected>Autodetectar</option>
        </select>
        <label for="voice-select">Voz</label>
        <select id="voice-select" disabled>
          <option value="">(auto)</option>
        </select>
      </div>
      <div class="row row-end">
        <button type="submit" id="generate-btn">Generar audiolibro</button>
      </div>
    </form>

    <div id="progress-box" class="progress-box hidden">
      <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
      <p id="progress-text">En cola...</p>
    </div>

    <div id="result-box" class="hidden"></div>
  </section>

  <section class="card">
    <h2>Biblioteca</h2>
    <p class="library-hint hidden" id="library-hint">
      Para sumar audiolibros propios (.m4b, .m4a, .mp3...), copialos a
      <code id="library-dir"></code> y recarga esta pagina: aparecen aca y en la app (Servidor &rarr; Descargar).
    </p>
    <ul id="library-list" class="library-list"></ul>
  </section>
</div>
<script src="app.js"></script>
</body>
</html>
